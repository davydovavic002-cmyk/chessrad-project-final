<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessRad - Вход</title>
    <link rel="stylesheet" href="/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="auth-container" class="auth-card" style="display: none;">
        <h1>ChessRad</h1>
        <p class="subtitle">Шахматы Онлайн</p>

        <div id="login-view">
            <h2>Вход</h2>
            <form id="login-form">
                <div class="form-group">
                    <input type="text" id="login-username" name="username" placeholder="Имя пользователя" required>
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" name="password" placeholder="Пароль" required>
                </div>
                <button type="submit" class="btn-auth">Войти</button>
            </form>
            <p class="switch-text">Нет аккаунта? <a href="#" id="show-register">Зарегистрироваться</a></p>
        </div>

        <div id="register-view" class="hidden">
            <h2>Регистрация</h2>
            <form id="register-form">
                <div class="form-group">
                    <input type="text" id="register-username" name="username" placeholder="Имя пользователя" required>
                </div>
                <div class="form-group">
                    <select id="register-role" name="role" class="form-control" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Inter';">
                        <option value="student">Я ученик</option>
                        <option value="teacher">Я учитель</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="password" id="register-password" name="password" placeholder="Пароль (мин. 4 символа)" minlength="4" required>
                </div>
                <div class="form-group">
                    <input type="password" id="register-confirm-password" name="confirmPassword" placeholder="Подтвердите пароль" required>
                </div>
                <button type="submit" class="btn-auth">Создать аккаунт</button>
            </form>
            <p class="switch-text">Уже есть аккаунт? <a href="#" id="show-login">Войти</a></p>
        </div>

        <p id="error-message" class="error-message hidden"></p>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
