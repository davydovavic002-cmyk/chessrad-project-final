<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебный класс - ChessRad</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/study.css">
</head>
<body>

    <header class="lobby-header">
        <div class="logo-area">
            <h1>ChessRad <span class="badge">STUDY</span></h1>
        </div>
        <div id="user-status" class="user-badge-text">Загрузка...</div>
    </header>

    <div class="study-grid">
        <div class="board-container">
            <div id="myBoard" style="width: 100%"></div>
            <canvas id="drawing-canvas"></canvas>

            <div class="controls" id="teacher-tools" style="display: none; margin-top: 15px;">
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn-secondary" id="reset-btn" style="flex: 1;">Начальная позиция</button>
                    <button class="btn-secondary" id="flip-btn" style="flex: 1;">Разворот</button>
                    <button class="btn-danger-light" id="clear-btn" style="flex: 1; font-size: 12px;">Очистить доску</button>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <div id="video-chat-container"></div>

            <div class="room-info">
                <h3 style="margin: 0; font-weight: 800;">Комната: <span id="room-id-display" style="color: var(--blue-primary);">---</span></h3>
                <p id="participant-info" style="font-size: 13px; color: var(--text-muted); margin: 2px 0;">Загрузка участников...</p>
            </div>

            <div class="mode-tabs">
                <button class="tab-btn active" id="mode-play">ИГРА</button>
                <button class="tab-btn" id="mode-demo">ДЕМО</button>
                <button class="tab-btn" id="mode-edit" style="display: none;">РЕДАКТОР</button>
            </div>

            <div id="status-msg" style="font-size: 12px; font-weight: 700; margin-bottom: 5px; min-height: 18px;"></div>

            <div id="side-panel-content" style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px;">
                <div id="moves-history-block" class="chat-area">
                    <div style="color: var(--text-muted); font-style: italic;">Система: Добро пожаловать!</div>
                </div>

                <div id="teacher-controls-block" style="display: none; flex-direction: column; gap: 8px;">
                    <textarea id="pgn-input" placeholder="Введите FEN или оставьте пустым для ручной расстановки..."
                              style="width: 100%; height: 50px; border: 1px solid #edf2f7; border-radius: 8px; padding: 8px; font-size: 11px; font-family: monospace; resize: none; background: #f8f9fa;"></textarea>

                    <div style="display: flex; gap: 6px;">
                        <button class="btn-primary-sm" id="import-btn" style="flex: 2; background: #f39c12;">ОПУБЛИКОВАТЬ В ДЕМО</button>
                        <button class="btn-secondary-icon" id="export-png-btn" title="Скачать PNG" style="flex: 1;">
                            <span>📥</span>
                        </button>
                    </div>
                </div>
            </div>

            <button class="btn-logout" style="width: 100%; margin-top: 10px;" onclick="window.location.href='/lobby.html'">Покинуть класс</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/study.js"></script>
</body>
</html>
